# You can put custom rules here
# Window/layer rules: https://wiki.hyprland.org/Configuring/Window-Rules/
# Workspace rules: https://wiki.hyprland.org/Configuring/Workspace-Rules/

windowrule = tag +browser, class:^([Ff]irefox|org.mozilla.firefox|[Ff]irefox-esr|[Ff]irefox-bin)$
windowrule = tag +browser, class:^([Gg]oogle-chrome(-beta|-dev|-unstable)?)$
windowrule = tag +browser, class:^(chrome-.+-Default)$ # Chrome PWAs
windowrule = tag +browser, class:^([Cc]hromium)$
windowrule = tag +browser, class:^([Mm]icrosoft-edge(-stable|-beta|-dev|-unstable))$
windowrule = tag +browser, class:^(Brave-browser(-beta|-dev|-unstable)?)$
windowrule = tag +browser, class:^([Tt]horium-browser|[Cc]achy-browser)$
windowrule = tag +browser, class:^(zen-alpha|zen)$

# project tags
windowrule = tag +projects, class:^(codium|codium-url-handler|VSCodium)$
windowrule = tag +projects, class:^(VSCode|code-url-handler)$
windowrule = tag +projects, class:^(Zed|dev.zed.Zed)$
windowrule = tag +projects, class:^(jetbrains-.+)$ # JetBrains IDEs

# terminal tags
windowrule = tag +terminal, class:^(Alacritty|kitty|kitty-dropterm)$

# OPACITY
windowrule = opacity 1.0 1.0, tag:browser*
windowrule = opacity 1.0 1.0, tag:projects*
windowrule = opacity 1.0 1.0, tag:im*
windowrule = opacity 1.0 1.0, tag:multimedia*
windowrule = opacity 1.0 1.0, tag:file-manager*
windowrule = opacity 1.0 1.0, tag:terminal*
windowrule = opacity 1.0 1.0, tag:settings*
windowrule = opacity 1.0 1.0, tag:viewer*
windowrule = opacity 1.0 1.0, tag:wallpaper*
windowrule = opacity 1.0 1.0, class:^(gedit|org.gnome.TextEditor|mousepad)$
windowrule = opacity 1.0 1.0, class:^(deluge)$
windowrule = opacity 1.0 1.0, class:^(im.riot.Riot)$ # Element matrix client
windowrule = opacity 1.0 1.0, class:^(seahorse)$ # gnome-keyring gui
windowrule = opacity 1.0 1.0, title:^(Picture-in-Picture)$

