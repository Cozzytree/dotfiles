# rut general config stuff here
# Here's a list of every variable: https://wiki.hyprland.org/Configuring/Variables/
general {
    # Gaps and border
    gaps_in = 0
    gaps_out = 0
    gaps_workspaces = 50
    
    border_size = 1
    col.active_border = rgba(808075FF)
    col.inactive_border = rgba(000000FF)
    resize_on_border = true

    no_focus_fallback = true
    
    # allow_tearing = true # This just allows the `immediate` window rule to work
    allow_tearing = false # This just allows the `immediate` window rule to work
    
    snap {
    	enabled = true
    }
}

decoration {
    rounding = 0 
    # active_opacity = 0.95
    # inactive_opacity = 0.95

    blur {
        enabled = false
        xray = true
        special = false
        new_optimizations = true
        size = 5
        passes = 3
        brightness = 1
        noise = 0.01
        contrast = 1
        popups = true
        popups_ignorealpha = 0.6
        input_methods = true
        input_methods_ignorealpha = 0.8
    }
    
    shadow {
        enabled = false
        ignore_window = true
        range = 20
        offset = 0 2
        render_power = 4
        color = rgba(000000FF)
    }
    
    # Dim
    dim_inactive = true
    dim_strength = 0.025
    dim_special = 0.07
}


animations {
  	enabled = false
   bezier = fluent_decel, 0, 0.2, 0.4, 1
   bezier = easeOutCirc, 0, 0.55, 0.45, 1
   bezier = easeOutCubic, 0.33, 1, 0.68, 1
   bezier = easeinoutsine, 0.37, 0, 0.63, 1
    
    # Windows
   animation = windowsIn, 1, 1, easeinoutsine, popin 60% # window open
   animation = windowsOut, 1, 1, easeOutCubic, popin 60% # window close.
   animation = windowsMove, 1, 1, easeinoutsine, slide # everything in between, moving, dragging, resizing.

   # Fading
   animation = fade, 1, 1, fluent_decel

  	animation = fadeLayersIn, 0
   animation = border, 0


	# Layers
	animation = layers, 1, 1, easeinoutsine, popin
	
   # Workspaces
   #animation = workspaces, 1, 3, fluent_decel, slidefade 30% # styles: slide, slidevert, fade, slidefade, slidefadevert
   animation = workspaces, 1, 1, fluent_decel, slidefadevert 30% # styles: slide, slidevert, fade, slidefade, slidefadevert

  	animation = specialWorkspace, 1, 1, fluent_decel, slidefade 10%
}
